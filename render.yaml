# Render Blueprint: SignGuard for a Microsoft 365 test tenant (free plans).
# Render: New > Blueprint > pick this repository. Render asks for every value marked sync: false.
#
# Free plan limits (Render docs, Nov 2026): the web service sleeps after 15 minutes without traffic and
# takes up to a minute to wake; the free PostgreSQL database expires 30 days after creation and is
# deleted 14 days later unless upgraded to a paid instance type. Upgrade both before real users rely on it.
#
# One service serves the API, the admin web (/) and the Outlook add-in (/addin/).
# The database schema is created by `python -m app.migrate`, which the container runs before the server.

databases:
  - name: signguard-db
    plan: free
    databaseName: signguard
    user: signguard

services:
  - type: web
    name: signguard
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: signguard-db
          property: connectionString
      # Microsoft sign-in only. Never set AUTH_MODE=dev on a public address.
      - key: AUTH_MODE
        value: entra
      - key: DIRECTORY_SOURCE
        value: graph
      # Keys for integrity seals and verification codes. Generated once by Render; never change it,
      # or every earlier seal and code stops verifying.
      - key: CODE_SECRET
        generateValue: true
      # Entra ID app registrations (IDs, not secrets), entered in the Render dashboard.
      - key: ENTRA_TENANT_ID
        sync: false
      - key: ENTRA_API_CLIENT_ID
        sync: false
      - key: ENTRA_API_AUDIENCE
        sync: false
      - key: ENTRA_SPA_CLIENT_ID
        sync: false
      # Secret for Microsoft Graph directory sync. Paste it in the dashboard; it is never in the repository.
      - key: ENTRA_API_CLIENT_SECRET
        sync: false
      # Comma-separated. These people become admins on first sign-in.
      - key: BOOTSTRAP_ADMINS
        sync: false
      # Comma-separated email domains treated as internal recipients.
      - key: INTERNAL_DOMAINS
        sync: false
