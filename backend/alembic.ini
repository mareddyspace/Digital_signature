# Database migrations. SignGuard runs them automatically at startup; this file is for the CLI:
#   cd backend
#   .venv\Scripts\alembic revision --autogenerate -m "add groups"   (then review the file!)
#   .venv\Scripts\alembic upgrade head
# The database URL comes from DATABASE_URL (see app/config.py), not from this file.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
