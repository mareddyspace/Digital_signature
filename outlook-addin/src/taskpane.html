<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SignGuard</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script>var SG_TASKPANE = true;</script>
    <script src="launchevent.js"></script>
    <style>
      body { font: 14px/1.45 "Segoe UI", system-ui, sans-serif; margin: 0; padding: 16px; color: #102a43; }
      h1 { font-size: 16px; margin: 0 0 12px; }
      .row { margin: 10px 0; }
      .label { font-size: 12px; color: #486581; text-transform: uppercase; letter-spacing: .04em; }
      .value { font-weight: 600; }
      .warn { background: #fff4e5; color: #8a4b00; border-radius: 8px; padding: 10px; margin: 12px 0; }
      .ok { background: #e3f9ee; color: #0f7b45; border-radius: 8px; padding: 10px; margin: 12px 0; }
      .code { font-family: Consolas, monospace; font-size: 15px; }
      button { width: 100%; padding: 10px; border: 0; border-radius: 6px; background: #1d4ed8; color: #fff; font-weight: 600; cursor: pointer; margin-top: 12px; }
      .preview { border: 1px solid #d9e2ec; border-radius: 8px; padding: 10px; margin-top: 12px; overflow: auto; }
    </style>
  </head>
  <body>
    <h1>SignGuard</h1>
    <div id="status">Loading…</div>
    <div class="row"><div class="label">Signature</div><div class="value" id="template">–</div></div>
    <div class="row"><div class="label">Why this one</div><div id="reason">–</div></div>
    <div class="row"><div class="label">Recipients</div><div id="rtype">–</div></div>
    <div class="row"><div class="label">Verification code</div><div class="code" id="code">–</div></div>
    <div id="warnings"></div>
    <button id="refresh">Refresh signature</button>
    <iframe class="preview" id="preview" sandbox="" title="Signature preview" style="width:100%;height:220px"></iframe>
    <script src="taskpane.js"></script>
  </body>
</html>
